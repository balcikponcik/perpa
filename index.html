<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perpa Koşu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@500;700&display=swap">
<style>
/* Layout: tek ekran arcade — üstte HUD, ortada tuval, altta dokunmatik tuşlar */
:root{
  --sky:#1d2b53; --road:#3a3a48; --ink:#fff6e0; --gold:#ffcc2e; --red:#e8322b; --blue:#25407a; --muted:#a9b3d6;
  --display:'Bangers','Impact',system-ui,sans-serif; --body:'Rubik',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;overflow:hidden;user-select:none;-webkit-user-select:none}
.wrap{width:100%;max-width:960px;display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}
.hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:30px;letter-spacing:2px;color:var(--gold);text-shadow:3px 3px 0 var(--red);line-height:1}
.bar{flex:1;min-width:160px;height:22px;background:#0e1633;border:2px solid var(--ink);border-radius:4px;position:relative;overflow:hidden}
.fill{height:100%;width:30%;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .15s}
.mark{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;text-shadow:1px 1px 0 #000}
.score{font-family:var(--display);font-size:22px;letter-spacing:1px;font-variant-numeric:tabular-nums}
button{font-family:var(--display);letter-spacing:1px;cursor:pointer;border:2px solid var(--ink);background:var(--blue);color:var(--ink);border-radius:6px;font-size:18px;padding:4px 12px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{width:100%;max-height:100%;aspect-ratio:16/9;max-width:100%;border:3px solid var(--ink);border-radius:8px;background:#000;touch-action:none;display:block;object-fit:contain}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:rgba(10,14,35,.78);border-radius:8px;padding:16px}
.ov h1{font-family:var(--display);font-size:clamp(40px,9vw,84px);margin:0;color:var(--gold);text-shadow:4px 4px 0 var(--red);letter-spacing:3px;line-height:.95}
.ov p{margin:0;max-width:52ch;color:var(--muted);line-height:1.5;font-size:15px}
.ov .big{font-size:24px;padding:8px 28px;background:var(--red)}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:14px}
.legend b{color:var(--ink)}
.pads{display:flex;gap:10px;justify-content:center}
.pads button{flex:1;max-width:220px;font-size:26px;padding:10px}
@media (hover:hover) and (pointer:fine){.pads{display:none}}
*{box-sizing:border-box}html,body{margin:0}
</style>
</head>
<body>

<div class="wrap">
  <div class="hud">
    <div class="logo">PERPA KOŞU</div>
    <div class="bar" aria-label="Güç"><div class="fill" id="fill"></div><div class="mark"></div><span id="pw">GÜÇ 30</span></div>
    <div class="score" id="sc">0 m</div>
    <button id="snd" aria-pressed="true">SES: AÇIK</button>
  </div>
  <div class="stage">
    <canvas id="c" width="960" height="540"></canvas>
    <div class="ov" id="ov">
      <h1>PERPA KOŞU</h1>
      <p>Perpa yolda koşuyor. Yukarı/aşağı ok tuşları (ya da W/S, ekrana dokunma) ile şerit değiştir.</p>
      <div class="legend">
        <span><b>🍔 Yemek</b> güç +8</span>
        <span><b>Kadın</b> “MEME!” der, güç +3</span>
        <span><b>Erkek</b> yakalarsa güç −15</span>
        <span><b>Güç 50+</b> PERPAAAA modu</span>
      </div>
      <p>Güç sıfıra inerse oyun biter.</p>
      <button class="big" id="go">KOŞ!</button>
    </div>
  </div>
  <div class="pads"><button id="up">▲</button><button id="dn">▼</button></div>
</div>

const face=new Image();face.src=FACE;
const cv=document.getElementById('c'),x=cv.getContext('2d');
const W=960,H=540,LANES=[250,345,440];
const $=id=>document.getElementById(id);
let st,sound=true;

function reset(){
  st={lane:1,py:LANES[1],power:30,dist:0,speed:6,items:[],t:0,spawn:0,bubbles:[],run:true,hero:false,flash:0,hit:0,best:st?st.best:0};
}
reset();st.run=false;

function say(txt,rate,pitch){
  if(!sound||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='tr-TR';u.rate=rate||1.1;u.pitch=pitch||1.2;u.volume=1;
    const vs=speechSynthesis.getVoices(),tr=vs.filter(v=>/^tr/i.test(v.lang));
    const male=/male|erkek|tolga|cem|ahmet|mehmet|emre|onur|daniel|alex|fred|david/i;
    const v=tr.find(v=>male.test(v.name)&&!/female/i.test(v.name))||tr[0];if(v)u.voice=v;
    speechSynthesis.speak(u);}catch(e){}
}
let ac;function beep(f,d,type){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}

function bubble(txt,big){st.bubbles.push({txt,big,life:big?110:60});}

function spawn(){
  const r=Math.random(),lane=Math.floor(Math.random()*3);
  let kind=r<.45?'food':r<.72?'woman':'man';
  const foods=['🍔','🍕','🌯','🍗','🥙','🍩','🌭'];
  st.items.push({kind,lane,x:W+60,y:LANES[lane],emoji:foods[Math.floor(Math.random()*foods.length)],done:false,v:kind==='man'?2.2:0,ph:Math.random()*6});
}

function setPower(p){
  const was=st.power;st.power=Math.max(0,Math.min(100,p));
  if(was<=50&&st.power>50){st.hero=true;st.flash=40;bubble('PERPAAAA!',true);say('PERPAAAAAAA',.7,.6);beep(220,.5,'sawtooth');}
  if(st.power<=50)st.hero=false;
  $('fill').style.width=st.power+'%';$('pw').textContent='GÜÇ '+Math.round(st.power);
  if(st.power<=0)end();
}

function end(){
  st.run=false;const m=Math.floor(st.dist);st.best=Math.max(st.best,m);
  $('ov').innerHTML=`<h1>YAKALANDIN!</h1><p>Perpa ${m} metre koşabildi. En iyi: ${st.best} m</p><button class="big" id="go">TEKRAR KOŞ</button>`;
  $('ov').hidden=false;$('go').onclick=start;
}
function start(){const b=st.best;reset();st.best=b;setPower(30);$('ov').hidden=true;beep(660,.1);}
$('go').onclick=start;

function move(d){if(!st.run)return;st.lane=Math.max(0,Math.min(2,st.lane+d));beep(440,.04);}
addEventListener('keydown',e=>{
  if(['ArrowUp','w','W'].includes(e.key)){move(-1);e.preventDefault();}
  if(['ArrowDown','s','S'].includes(e.key)){move(1);e.preventDefault();}
  if((e.key===' '||e.key==='Enter')&&!st.run){start();e.preventDefault();}
});
$('up').onclick=()=>move(-1);$('dn').onclick=()=>move(1);
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const y=(e.clientY-r.top)/r.height*H;move(y<st.py?-1:1);});
$('snd').onclick=()=>{sound=!sound;$('snd').textContent='SES: '+(sound?'AÇIK':'KAPALI');$('snd').setAttribute('aria-pressed',sound);if(!sound)try{speechSynthesis.cancel()}catch(e){}};

/* ---------- çizim ---------- */
function bg(){
  const g=x.createLinearGradient(0,0,0,200);g.addColorStop(0,'#3d6fd1');g.addColorStop(1,'#a9d3f5');
  x.fillStyle=g;x.fillRect(0,0,W,200);
  // binalar (İstanbul apartmanları)
  const off=(st.t*1.2)%240;
  for(let i=-1;i<6;i++){const bx=i*240-off;
    x.fillStyle='#e9e1d3';x.fillRect(bx+10,70,90,130);x.fillStyle='#d7c7b0';x.fillRect(bx+120,40,70,160);x.fillStyle='#c76b4e';x.fillRect(bx+5,64,100,8);
    x.fillStyle='#7aa0c4';for(let r=0;r<5;r++)for(let c=0;c<3;c++){x.fillRect(bx+20+c*26,82+r*22,14,12);}
    for(let r=0;r<7;r++)for(let c=0;c<2;c++){x.fillRect(bx+132+c*28,52+r*20,14,12);}
  }
  x.fillStyle='#6a9a4a';x.fillRect(0,190,W,20);
  x.fillStyle='#4a4a58';x.fillRect(0,205,W,H-205);
  x.fillStyle='#bdbdbd';x.fillRect(0,203,W,6);x.fillRect(0,H-12,W,12);
  x.fillStyle='#f4e04d';const d=(st.t*st.speed)%80;
  for(const ly of [297,392])for(let i=-1;i<14;i++)x.fillRect(i*80-d,ly,44,5);
}

function runner(px,py){
  const ph=st.t*.35,leg=Math.sin(ph)*14,arm=Math.cos(ph)*10;
  x.save();x.translate(px,py);
  if(st.hit>0&&Math.floor(st.hit/4)%2)x.globalAlpha=.4;
  if(st.hero){x.fillStyle='rgba(255,204,46,.35)';x.beginPath();x.ellipse(0,-50,70,95,0,0,7);x.fill();}
  // pelerin
  x.fillStyle='#e8322b';x.beginPath();x.moveTo(-14,-78);x.quadraticCurveTo(-60,-40+Math.sin(ph*1.3)*8,-70,-10+Math.sin(ph)*6);x.lineTo(-20,-20);x.closePath();x.fill();
  // sırt çantası
  x.fillStyle='#2c6b3f';x.fillRect(-38,-78,18,44);x.fillStyle='#1d4a2b';x.fillRect(-38,-62,18,5);
  // bacaklar
  x.strokeStyle='#25407a';x.lineWidth=13;x.lineCap='round';
  x.beginPath();x.moveTo(-5,-22);x.lineTo(-5-leg,8);x.stroke();
  x.beginPath();x.moveTo(5,-22);x.lineTo(5+leg,8);x.stroke();
  x.fillStyle='#222';x.fillRect(-12-leg,4,16,8);x.fillRect(-2+leg,4,16,8);
  // gövde
  x.fillStyle='#25407a';x.beginPath();x.ellipse(0,-50,26,34,0,0,7);x.fill();
  // çanta askısı
  x.strokeStyle='#1d4a2b';x.lineWidth=4;x.beginPath();x.moveTo(-18,-78);x.lineTo(10,-40);x.stroke();
  // göğüs rozeti
  x.fillStyle='#ffcc2e';x.strokeStyle='#e8322b';x.lineWidth=2;x.beginPath();x.arc(4,-56,13,0,7);x.fill();x.stroke();
  x.fillStyle='#e8322b';x.font='bold 9px Rubik,sans-serif';x.textAlign='center';x.fillText('PERPA',4,-53);
  // arka kol
  x.strokeStyle='#25407a';x.lineWidth=10;x.beginPath();x.moveTo(-14,-70);x.lineTo(-24-arm,-46);x.stroke();
  // ön kol + kamera
  x.beginPath();x.moveTo(14,-70);x.lineTo(30+arm*.3,-56);x.stroke();
  x.fillStyle='#111';x.fillRect(26+arm*.3,-68,26,18);x.fillStyle='#333';x.beginPath();x.arc(46+arm*.3,-59,7,0,7);x.fill();
  x.fillStyle='#7fd4ff';x.beginPath();x.arc(46+arm*.3,-59,3.5,0,7);x.fill();x.fillStyle='#e33';x.fillRect(29+arm*.3,-66,4,3);
  // kafa (fotoğraf)
  const hy=-118+Math.abs(Math.sin(ph))*-3;
  if(face.complete)x.drawImage(face,-27,hy,54,65);
  // kulak üstü kulaklık
  x.strokeStyle='#111';x.lineWidth=6;x.beginPath();x.arc(0,hy+30,30,Math.PI*1.1,Math.PI*1.9);x.stroke();
  x.fillStyle='#e8322b';x.beginPath();x.ellipse(-28,hy+34,7,11,0,0,7);x.fill();x.beginPath();x.ellipse(28,hy+34,7,11,0,0,7);x.fill();
  x.fillStyle='#111';x.fillRect(-31,hy+26,4,16);x.fillRect(27,hy+26,4,16);
  x.restore();
}

function woman(it){
  const b=Math.sin(st.t*.2+it.ph)*3;x.save();x.translate(it.x,it.y);
  x.fillStyle='#d94f8a';x.beginPath();x.moveTo(-22,6);x.lineTo(22,6);x.lineTo(12,-50);x.lineTo(-12,-50);x.closePath();x.fill();
  x.fillStyle='#f0c39a';x.beginPath();x.arc(0,-66+b,15,0,7);x.fill();
  x.fillStyle='#5a2e14';x.beginPath();x.arc(0,-72+b,17,Math.PI,0);x.fill();x.fillRect(-17,-72+b,8,34);x.fillRect(9,-72+b,8,34);
  x.fillStyle='#222';x.fillRect(-6,-68+b,3,3);x.fillRect(3,-68+b,3,3);
  x.strokeStyle='#f0c39a';x.lineWidth=6;x.beginPath();x.moveTo(-10,-44);x.lineTo(-16,-24);x.moveTo(10,-44);x.lineTo(18,-60+b);x.stroke();
  x.fillStyle='#333';x.fillRect(-10,6,6,8);x.fillRect(4,6,6,8);
  x.restore();
}

function man(it){
  const ph=st.t*.4+it.ph,leg=Math.sin(ph)*12;x.save();x.translate(it.x,it.y);x.scale(-1,1);
  x.strokeStyle='#2f2f2f';x.lineWidth=11;x.lineCap='round';
  x.beginPath();x.moveTo(-4,-20);x.lineTo(-4-leg,8);x.moveTo(4,-20);x.lineTo(4+leg,8);x.stroke();
  x.fillStyle='#7b8c99';x.fillRect(-18,-60,36,42);
  x.strokeStyle='#7b8c99';x.lineWidth=9;x.beginPath();x.moveTo(14,-54);x.lineTo(34,-62+leg*.3);x.moveTo(-14,-54);x.lineTo(-26,-40);x.stroke();
  x.fillStyle='#e0b48a';x.beginPath();x.arc(0,-74,15,0,7);x.fill();
  x.fillStyle='#222';x.fillRect(-15,-90,30,9);x.fillRect(-9,-70,18,4);
  x.fillStyle='#111';x.fillRect(3,-79,3,3);x.fillRect(-6,-79,3,3);
  x.restore();
  x.fillStyle='#fff';x.font='bold 15px Rubik,sans-serif';x.textAlign='center';x.fillText('DUR!',it.x,it.y-100);
}

function food(it){
  x.font='44px serif';x.textAlign='center';x.textBaseline='middle';
  x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.ellipse(it.x,it.y+4,20,6,0,0,7);x.fill();
  x.fillText(it.emoji,it.x,it.y-26+Math.sin(st.t*.15+it.ph)*4);x.textBaseline='alphabetic';
}

function drawBubbles(px,py){
  st.bubbles=st.bubbles.filter(b=>b.life-->0);
  st.bubbles.forEach((b,i)=>{
    const s=b.big?54:30,yy=py-170-i*10-(b.big?20:0);
    x.font=`${s}px Bangers,Impact,sans-serif`;const w=x.measureText(b.txt).width+30;
    const bx=Math.min(W-w/2-10,px+60);
    x.fillStyle=b.big?'#ffcc2e':'#fff';x.strokeStyle='#111';x.lineWidth=3;
    x.beginPath();x.roundRect(bx-w/2,yy-s,w,s+16,12);x.fill();x.stroke();
    x.beginPath();x.moveTo(bx-w/2+20,yy+16);x.lineTo(px+10,py-115);x.lineTo(bx-w/2+44,yy+16);x.fill();x.stroke();
    x.fillStyle=b.big?'#e8322b':'#111';x.textAlign='center';x.fillText(b.txt,bx,yy+4);
  });
}

function loop(){
  st.t++;
  if(st.run){
    st.speed=6+st.dist/400+(st.hero?2:0);st.dist+=st.speed/10;
    st.py+=(LANES[st.lane]-st.py)*.25;
    if(--st.spawn<=0){spawn();st.spawn=Math.max(28,70-st.dist/40)+Math.random()*30;}
    if(st.t%90===0&&!st.hero)setPower(st.power-1); // açlık
    if(st.hit>0)st.hit--;
    for(const it of st.items){
      it.x-=st.speed+it.v;
      if(!it.done&&it.lane===st.lane&&Math.abs(it.x-200)<38){
        it.done=true;
        if(it.kind==='food'){setPower(st.power+8);beep(880,.08,'triangle');bubble('HAM!');}
        else if(it.kind==='woman'){bubble('MEME!');say('meme!',1.5,2);setPower(st.power+3);}
        else{ if(st.hit>0){it.done=false;continue;} st.hit=50;bubble('AAH!');beep(120,.3,'sawtooth');setPower(st.power-15);}
      }
    }
    st.items=st.items.filter(i=>i.x>-80&&!(i.done&&i.kind==='food'));
    $('sc').textContent=Math.floor(st.dist)+' m';
  }
  bg();
  const all=[...st.items.filter(i=>!(i.kind==='woman'&&i.done&&false)),{kind:'me',y:st.py}].sort((a,b)=>a.y-b.y);
  for(const it of all){ if(it.kind==='me')runner(200,st.py); else if(it.kind==='food')food(it); else if(it.kind==='woman')woman(it); else man(it);}
  drawBubbles(200,st.py);
  if(st.flash>0){x.fillStyle=`rgba(255,240,150,${st.flash/80})`;x.fillRect(0,0,W,H);st.flash--;}
  if(st.hero){x.font='26px Bangers,Impact,sans-serif';x.fillStyle='#ffcc2e';x.textAlign='left';x.fillText('PERPA MODU: hız arttı, açlık yok',16,236);}
  requestAnimationFrame(loop);
}
face.onload=()=>{};loop();
</script>
